<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Applier - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      padding: 40px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header h1 {
      font-size: 2em;
      color: #333;
      margin-bottom: 10px;
    }
    .auth-header p {
      color: #666;
      font-size: 0.9em;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1em;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin-bottom: 15px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .toggle-form {
      background: #f0f0f0;
      color: #333;
      margin-top: 10px;
    }
    .toggle-form:hover {
      background: #e0e0e0;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }
    .error {
      background: #fee;
      border: 1px solid #fcc;
      color: #c33;
    }
    .success {
      background: #efe;
      border: 1px solid #cfc;
      color: #3c3;
    }
    .divider {
      text-align: center;
      margin: 20px 0;
      color: #999;
    }
    #loginForm { display: block; }
    #signupForm { display: none; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>🚀 Job Applier</h1>
      <p>AI-powered job application assistant</p>
    </div>

    <div id="message"></div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
      <button type="button" class="toggle-form" onclick="toggleForm()">Don't have an account? Sign Up</button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm">
      <div class="form-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" required>
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="At least 6 characters" required>
      </div>
      <div class="form-group">
        <label for="signupPasswordConfirm">Confirm Password</label>
        <input type="password" id="signupPasswordConfirm" required>
      </div>
      <button type="submit" class="btn-primary">Create Account</button>
      <button type="button" class="toggle-form" onclick="toggleForm()">Already have an account? Sign In</button>
    </form>
  </div>

  <script>
    function toggleForm() {
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const isLoginVisible = getComputedStyle(loginForm).display !== 'none';
      loginForm.style.display = isLoginVisible ? 'none' : 'block';
      signupForm.style.display = isLoginVisible ? 'block' : 'none';
      document.getElementById('message').innerHTML = '';
    }

    function showMessage(text, isError = false) {
      const msg = document.getElementById('message');
      msg.innerHTML = `<div class="message ${isError ? 'error' : 'success'}">${text}</div>`;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (!response.ok) {
          showMessage(data.error, true);
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/index.html';
      } catch (error) {
        showMessage('Error logging in: ' + error.message, true);
      }
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupPasswordConfirm').value;

      if (password !== confirm) {
        showMessage('Passwords do not match', true);
        return;
      }

      try {
        const response = await fetch('/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (!response.ok) {
          showMessage(data.error, true);
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/index.html';
      } catch (error) {
        showMessage('Error signing up: ' + error.message, true);
      }
    });

    // Check if already logged in
    window.addEventListener('load', () => {
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = '/index.html';
      }
    });
  </script>
</body>
</html>
