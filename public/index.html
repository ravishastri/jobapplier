<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Applier - AI-Powered Application Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    header { text-align: center; color: white; margin-bottom: 30px; }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    .subtitle { font-size: 1.1em; opacity: 0.9; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .card h2 { font-size: 1.2em; margin-bottom: 15px; color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
    textarea { width: 100%; height: 150px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 0.95em; resize: vertical; }
    textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #555; font-size: 0.9em; }
    button { padding: 12px 20px; border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.3s ease; width: 100%; }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
    .btn-secondary { background: #f0f0f0; color: #333; margin-top: 10px; }
    .btn-secondary:hover { background: #e0e0e0; }
    .btn-small { padding: 8px 12px; font-size: 0.85em; width: auto; display: inline-block; margin-right: 10px; }
    .loading { text-align: center; color: #667eea; font-weight: 600; }
    .spinner { display: inline-block; animation: spin 1s linear infinite; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: #fee; border: 1px solid #fcc; color: #c33; padding: 12px; border-radius: 8px; margin-top: 10px; }
    .success { background: #efe; border: 1px solid #cfc; color: #3c3; padding: 12px; border-radius: 8px; margin-top: 10px; }
    .output-section { grid-column: 1 / -1; }
    .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .answer-box { background: #f9f9f9; border: 1px solid #eee; border-radius: 8px; padding: 15px; border-left: 4px solid #667eea; }
    .answer-label { font-weight: 600; color: #667eea; font-size: 0.9em; margin-bottom: 8px; }
    .answer-text { color: #333; line-height: 1.6; font-size: 0.95em; }
    .resume-output { background: #f9f9f9; border: 1px solid #eee; border-radius: 8px; padding: 20px; white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 0.9em; line-height: 1.6; color: #333; max-height: 500px; overflow-y: auto; }
    .action-buttons { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .action-btn { background: #667eea; color: white; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85em; width: auto; }
    .action-btn:hover { background: #764ba2; }
    .badge { display: inline-block; background: #667eea; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; margin-top: 5px; }
    .resume-comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
    .resume-panel { background: #f9f9f9; border: 1px solid #eee; border-radius: 8px; padding: 20px; }
    .resume-panel h3 { color: #667eea; margin-bottom: 15px; font-size: 1em; text-align: center; }
    .resume-panel.original { border-left: 4px solid #667eea; }
    .resume-panel.tailored { border-left: 4px solid #28a745; }
    .resume-text { white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 0.85em; line-height: 1.5; color: #333; max-height: 600px; overflow-y: auto; }
    .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .logout-btn { background: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9em; font-weight: 600; transition: all 0.3s; }
    .logout-btn:hover { background: #c82333; transform: translateY(-2px); }
    @media (max-width: 1024px) { .grid { grid-template-columns: 1fr; } .answers-grid { grid-template-columns: 1fr; } .resume-comparison { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div>
          <h1>🚀 Job Applier</h1>
          <p class="subtitle">AI-powered job application assistant</p>
        </div>
        <div style="text-align: right;">
          <p id="userEmail" style="color: white; margin-bottom: 8px; font-size: 0.9em;"></p>
          <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>
      </div>
    </header>
    <div class="grid">
      <div class="card">
        <h2>📝 Your Profile (Saved)</h2>
        <div class="input-group">
          <label>Enter your background and key achievements</label>
          <textarea id="profileNotes" placeholder="e.g., Senior React developer with 5 years experience..."></textarea>
        </div>
        <button class="btn-primary" onclick="saveProfile()">💾 Save Profile</button>
        <button class="btn-secondary btn-small" onclick="clearProfile()">Clear</button>
        <div id="profileStatus"></div>
      </div>

      <div class="card">
        <h2>📄 Your Resume (Stored)</h2>
        <div class="input-group">
          <label>Paste your resume here - this will be tailored for each job</label>
          <textarea id="storedResume" placeholder="Your resume text or markdown..."></textarea>
        </div>
        <button class="btn-primary" onclick="saveResume()">💾 Save Resume</button>
        <button class="btn-secondary btn-small" onclick="clearResume()">Clear</button>
        <div id="resumeStatus"></div>
      </div>

      <div class="card">
        <h2>💼 Job Description</h2>
        <div class="input-group">
          <label>Paste the job description or key requirements</label>
          <textarea id="jobDescription" placeholder="Senior React Developer needed..."></textarea>
        </div>
      </div>

      <div class="card">
        <h2>❓ Application Questions</h2>
        <div class="input-group">
          <label>Enter each question on a new line</label>
          <textarea id="jobQuestions" placeholder="Why are you interested in this role?&#10;What are your key strengths?"></textarea>
        </div>
        <button class="btn-primary" onclick="generateAnswers()">Generate Answers</button>
        <div id="answersMessage"></div>
      </div>

      <div class="card">
        <h2>✨ Generated Answers</h2>
        <div id="answersContainer"></div>
      </div>

      <div class="card output-section">
        <h2>📄 Tailored Resume</h2>
        <button class="btn-primary" onclick="tailorResume()">Generate Tailored Resume</button>
        <div id="resumeMessage"></div>
        <div id="resumeContainer"></div>
      </div>
    </div>
  </div>

  <script>
    let fullTailoredResume = ''; // Store full resume text for download

    // Load saved data on page load
    window.addEventListener('load', async () => {
      console.log('Page loaded, starting data load...');
      const savedProfile = localStorage.getItem('jobApplierProfile');
      if (savedProfile) {
        console.log('Found profile in localStorage');
        document.getElementById('profileNotes').value = savedProfile;
        document.getElementById('profileStatus').innerHTML = '<div class="badge">✅ Profile loaded from memory</div>';
      }

      // Try to load from database
      try {
        const token = localStorage.getItem('token');
        console.log('Token exists:', !!token);
        if (token) {
          const response = await fetch('/auth/me', {
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          console.log('Auth/me response status:', response.status);
          if (response.ok) {
            const user = await response.json();
            console.log('User data:', {hasProfileNotes: !!user.profile_notes, hasStoredResume: !!user.stored_resume});
            if (user.profile_notes && !savedProfile) {
              console.log('Loading profile from DB');
              document.getElementById('profileNotes').value = user.profile_notes;
              document.getElementById('profileStatus').innerHTML = '<div class="badge">✅ Profile loaded from account</div>';
            }
          }
        }
      } catch (error) {
        console.log('Could not load profile from DB:', error);
      }

      loadResume();
    });

    async function saveProfile() {
      const profile = document.getElementById('profileNotes').value.trim();
      if (!profile) {
        document.getElementById('profileStatus').innerHTML = '<div class="error">⚠️ Please enter your profile first</div>';
        return;
      }

      // Save to localStorage
      localStorage.setItem('jobApplierProfile', profile);

      // Save to database
      try {
        const token = localStorage.getItem('token');
        if (token) {
          const response = await fetch('/auth/profile', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ profileNotes: profile, storedResume: localStorage.getItem('jobApplierResume') || document.getElementById('storedResume').value })
          });
          if (!response.ok) throw new Error(`API error: ${response.status}`);
        }
      } catch (error) {
        console.log('Error saving to database:', error);
      }

      document.getElementById('profileStatus').innerHTML = '<div class="success">✅ Profile saved!</div>';
      setTimeout(() => { document.getElementById('profileStatus').innerHTML = ''; }, 3000);
    }

    function clearProfile() {
      if (confirm('Clear saved profile?')) {
        localStorage.removeItem('jobApplierProfile');
        document.getElementById('profileNotes').value = '';
        document.getElementById('profileStatus').innerHTML = '<div class="success">✅ Profile cleared</div>';
      }
    }

    async function saveResume() {
      const resume = document.getElementById('storedResume').value.trim();
      if (!resume) {
        document.getElementById('resumeStatus').innerHTML = '<div class="error">⚠️ Please enter your resume first</div>';
        return;
      }

      // Save to localStorage
      localStorage.setItem('jobApplierResume', resume);

      // Save to database
      try {
        const token = localStorage.getItem('token');
        if (token) {
          const response = await fetch('/auth/profile', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ profileNotes: localStorage.getItem('jobApplierProfile') || document.getElementById('profileNotes').value, storedResume: resume })
          });
          if (!response.ok) throw new Error(`API error: ${response.status}`);
        }
      } catch (error) {
        console.log('Error saving to database:', error);
      }

      document.getElementById('resumeStatus').innerHTML = '<div class="success">✅ Resume saved!</div>';
      setTimeout(() => { document.getElementById('resumeStatus').innerHTML = ''; }, 3000);
    }

    function clearResume() {
      if (confirm('Clear saved resume?')) {
        localStorage.removeItem('jobApplierResume');
        document.getElementById('storedResume').value = '';
        document.getElementById('resumeStatus').innerHTML = '<div class="success">✅ Resume cleared</div>';
      }
    }

    async function loadResume() {
      const saved = localStorage.getItem('jobApplierResume');
      if (saved) {
        document.getElementById('storedResume').value = saved;
        document.getElementById('resumeStatus').innerHTML = '<div class="badge">✅ Resume loaded from memory</div>';
      }

      // Try to load from database if not in localStorage
      if (!saved) {
        try {
          const token = localStorage.getItem('token');
          console.log('Attempting to load resume from DB, token exists:', !!token);
          if (token) {
            const response = await fetch('/auth/me', {
              headers: {
                'Authorization': `Bearer ${token}`
              }
            });
            console.log('Resume load response status:', response.status);
            if (response.ok) {
              const user = await response.json();
              console.log('User data received:', {hasStoredResume: !!user.stored_resume, resumeLength: user.stored_resume?.length});
              if (user.stored_resume) {
                document.getElementById('storedResume').value = user.stored_resume;
                document.getElementById('resumeStatus').innerHTML = '<div class="badge">✅ Resume loaded from account</div>';
                localStorage.setItem('jobApplierResume', user.stored_resume);
              }
            }
          }
        } catch (error) {
          console.log('Could not load resume from DB:', error);
        }
      }
    }

    async function generateAnswers() {
      const profileNotes = localStorage.getItem('jobApplierProfile') || document.getElementById('profileNotes').value.trim();
      const jobQuestions = document.getElementById('jobQuestions').value.trim();
      const answersContainer = document.getElementById('answersContainer');
      const answersMessage = document.getElementById('answersMessage');

      if (!profileNotes) {
        answersMessage.innerHTML = '<div class="error">⚠️ Please save your profile first</div>';
        return;
      }
      if (!jobQuestions) {
        answersMessage.innerHTML = '<div class="error">⚠️ Please enter questions</div>';
        return;
      }

      answersMessage.innerHTML = '<div class="loading"><span class="spinner">⚙️</span>Generating answers...</div>';
      answersContainer.innerHTML = '';
      const questions = jobQuestions.split('\n').map(q => q.trim()).filter(q => q.length > 0);

      try {
        const response = await fetch('/api/generate-answers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ questions, context: profileNotes })
        });
        if (!response.ok) throw new Error(`API error: ${response.status}`);
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        answersMessage.innerHTML = '<div class="success">✅ Answers generated!</div>';
        const answers = data.answers;
        let html = '<div class="answers-grid">';
        questions.forEach((question, i) => {
          const answerKey = `answer_${i + 1}`;
          const answer = answers[answerKey] || 'No answer generated';
          html += `<div class="answer-box"><div class="answer-label">Q${i + 1}: ${question}</div><div class="answer-text">${answer}</div></div>`;
        });
        html += '</div>';
        answersContainer.innerHTML = html;
      } catch (error) {
        answersMessage.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
      }
    }

    async function tailorResume() {
      const storedResume = localStorage.getItem('jobApplierResume') || document.getElementById('storedResume').value.trim();
      const jobDescription = document.getElementById('jobDescription').value.trim();
      const resumeContainer = document.getElementById('resumeContainer');
      const resumeMessage = document.getElementById('resumeMessage');

      if (!storedResume) {
        resumeMessage.innerHTML = '<div class="error">⚠️ Please save your resume first</div>';
        return;
      }
      if (!jobDescription) {
        resumeMessage.innerHTML = '<div class="error">⚠️ Please enter job description</div>';
        return;
      }

      resumeMessage.innerHTML = '<div class="loading"><span class="spinner">⚙️</span>Tailoring resume...</div>';
      resumeContainer.innerHTML = '';

      try {
        const response = await fetch('/api/tailor-resume', {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ resume: storedResume, jobDescription })
        });
        if (!response.ok) throw new Error(`API error: ${response.status}`);
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        resumeMessage.innerHTML = '<div class="success">✅ Resume tailored and saved locally!</div>';
        fullTailoredResume = data.tailoredResume; // Store full text for download
        const escapedOriginal = storedResume.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const escapedTailored = data.tailoredResume.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const resumeHtml = `
          <div class="resume-comparison">
            <div class="resume-panel original">
              <h3>📄 Your Original Resume</h3>
              <div class="resume-text">${escapedOriginal}</div>
            </div>
            <div class="resume-panel tailored">
              <h3>✨ Tailored for This Job</h3>
              <div class="resume-text" id="tailoredResumeText">${escapedTailored}</div>
            </div>
          </div>
          <div class="action-buttons" style="margin-top: 20px;">
            <button class="action-btn" onclick="copyToClipboard('#tailoredResumeText')">📋 Copy Tailored</button>
            <button class="action-btn" onclick="downloadResume()">⬇️ Download Tailored</button>
          </div>
        `;
        resumeContainer.innerHTML = resumeHtml;
      } catch (error) {
        resumeMessage.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
      }
    }

    function copyToClipboard(selector) {
      const text = fullTailoredResume || document.querySelector(selector)?.textContent || '';
      if (!text) {
        alert('No text to copy');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert('✅ Copied to clipboard!');
      }).catch(err => {
        alert('❌ Failed to copy: ' + err);
      });
    }

    function downloadResume() {
      if (!fullTailoredResume) {
        alert('No resume to download');
        return;
      }
      const blob = new Blob([fullTailoredResume], { type: 'text/plain' });
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `tailored-resume-${new Date().toISOString().split('T')[0]}.txt`;
      document.body.appendChild(link);
      link.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(link);
    }
  </script>
</body>
</html>

  <script>
    // ===== AUTHENTICATION =====
    window.addEventListener('load', () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/auth.html';
      } else {
        // Display user email in header
        const user = localStorage.getItem('user');
        if (user) {
          try {
            const userData = JSON.parse(user);
            document.getElementById('userEmail').textContent = userData.email || 'User';
          } catch (e) {
            console.log('Could not parse user data');
          }
        }
      }
    });

    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        // Only clear auth data, keep profile and resume
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/auth.html';
      }
    }

    function getAuthHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      };
    }

    // Update all fetch calls to include auth header
    // Update generate answers to use auth headers
    const originalGenerateAnswers = window.generateAnswers;
    window.generateAnswers = async function() {
      const profileNotes = localStorage.getItem('jobApplierProfile') || document.getElementById('profileNotes').value.trim();
      const jobQuestions = document.getElementById('jobQuestions').value.trim();
      const answersContainer = document.getElementById('answersContainer');
      const answersMessage = document.getElementById('answersMessage');

      if (!profileNotes) {
        answersMessage.innerHTML = '<div class="error">⚠️ Please save your profile first</div>';
        return;
      }
      if (!jobQuestions) {
        answersMessage.innerHTML = '<div class="error">⚠️ Please enter questions</div>';
        return;
      }

      answersMessage.innerHTML = '<div class="loading"><span class="spinner">⚙️</span>Generating answers...</div>';
      answersContainer.innerHTML = '';
      const questions = jobQuestions.split('\n').map(q => q.trim()).filter(q => q.length > 0);

      try {
        const response = await fetch('/api/generate-answers', {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ questions, context: profileNotes })
        });
        if (!response.ok) throw new Error(`API error: ${response.status}`);
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        answersMessage.innerHTML = '<div class="success">✅ Answers generated!</div>';
        const answers = data.answers;
        let html = '<div class="answers-grid">';
        questions.forEach((question, i) => {
          const answerKey = `answer_${i + 1}`;
          const answer = answers[answerKey] || 'No answer generated';
          html += `<div class="answer-box"><div class="answer-label">Q${i + 1}: ${question}</div><div class="answer-text">${answer}</div></div>`;
        });
        html += '</div>';
        answersContainer.innerHTML = html;
      } catch (error) {
        answersMessage.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
      }
    };

  </script>
